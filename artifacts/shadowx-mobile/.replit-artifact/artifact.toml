kind = "mobile"
previewPath = "/"
title = "ShadowX"
description = "A mobile-friendly 2D shadow action game where players fight advancing enemies, collect coins, level up, and upgrade a mysterious warrior through increasingly difficult arenas."
version = "1.0.0"
id = "artifacts/shadowx-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22543

[services.development]
run = "pnpm --filter @workspace/shadowx-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shadowx-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/shadowx-mobile", "run", "serve" ]

[services.env]
PORT = "22543"
BASE_PATH = "/"
